<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F4E6"/>
      <stop offset="60%" stop-color="#F5FAF4"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8B2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F6CB7B" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="terrace1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B7451"/>
      <stop offset="100%" stop-color="#1E4D34"/>
    </linearGradient>
    <linearGradient id="terrace2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#285E3E"/>
      <stop offset="100%" stop-color="#163B27"/>
    </linearGradient>
    <linearGradient id="basketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBB595"/>
      <stop offset="100%" stop-color="#8F785A"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect width="600" height="400" rx="16" fill="url(#skyGrad)"/>

  <!-- Morning Sun in Mountain Mist -->
  <circle cx="430" cy="110" r="70" fill="url(#sunGrad)" filter="url(#softGlow)"/>

  <!-- Mountain Silhouettes in Mist -->
  <path d="M0,170 Q130,110 260,140 T520,120 T600,150 L600,400 L0,400 Z" fill="#D2E7D2" opacity="0.6"/>
  <path d="M0,200 Q160,150 320,180 T600,160 L600,400 L0,400 Z" fill="#B3D7B5" opacity="0.75"/>

  <!-- Layered Tea Terraces (茶園梯田) -->
  <path d="M-20,240 Q120,190 280,220 T620,200 L620,400 L-20,400 Z" fill="#5A956C" opacity="0.9"/>
  <path d="M-20,280 Q150,230 360,260 T620,240 L620,400 L-20,400 Z" fill="url(#terrace1)"/>
  <path d="M-20,320 Q180,280 390,300 T620,285 L620,400 L-20,400 Z" fill="url(#terrace2)"/>

  <!-- Tea Rows Texture (波浪茶樹行) -->
  <g stroke="#6AA97D" stroke-width="4" stroke-linecap="round" opacity="0.5" fill="none">
    <path d="M20,295 Q140,265 260,280 T500,270"/>
    <path d="M30,335 Q180,305 320,320 T580,310"/>
    <path d="M10,365 Q200,345 380,355 T590,345"/>
  </g>

  <!-- Bamboo Tea Harvesting Basket (竹編採茶簍) -->
  <g transform="translate(130, 230)">
    <!-- Shadow -->
    <ellipse cx="60" cy="140" rx="45" ry="12" fill="#0E2519" opacity="0.4"/>
    <!-- Basket body -->
    <path d="M25,60 L38,135 Q60,145 82,135 L95,60 Q60,50 25,60 Z" fill="url(#basketGrad)"/>
    <!-- Basket weaves -->
    <path d="M28,80 Q60,70 92,80 M32,100 Q60,90 88,100 M35,120 Q60,110 85,120" stroke="#755E44" stroke-width="2" fill="none"/>
    <line x1="42" y1="60" x2="48" y2="135" stroke="#755E44" stroke-width="1.5"/>
    <line x1="60" y1="56" x2="60" y2="138" stroke="#755E44" stroke-width="1.5"/>
    <line x1="78" y1="60" x2="72" y2="135" stroke="#755E44" stroke-width="1.5"/>
    <!-- Basket rim -->
    <ellipse cx="60" cy="58" rx="35" ry="8" fill="#E4D6BE" stroke="#8F785A" stroke-width="2"/>
    <!-- Fresh tea leaves inside basket -->
    <path d="M35,55 Q50,30 65,52 Q80,28 90,56 Q70,62 35,55 Z" fill="#4CAF50"/>
    <path d="M48,45 Q60,25 70,40" stroke="#388E3C" stroke-width="2" fill="none"/>
    <path d="M65,42 Q78,22 84,45" stroke="#388E3C" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Floating Tender Tea Leaves (一心二葉象徵) -->
  <g transform="translate(420, 260) rotate(-10)">
    <path d="M0,0 Q15,-20 30,0 Q15,10 0,0 Z" fill="#66BB6A"/>
    <path d="M12,-2 Q20,-30 40,-12 Q24,-5 12,-2 Z" fill="#81C784"/>
    <path d="M8,4 Q18,25 35,15 Q20,6 8,4 Z" fill="#4CAF50"/>
    <circle cx="0" cy="0" r="3" fill="#2E7D32"/>
  </g>
</svg>
